<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Elena in Macedonia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: one centred column (max 760px). Home = six "cities", each with three lesson stops; play = one question card at a time. */
:root{
  --bg:#EDF2F5; --surface:#FFFFFF; --surface-2:#F4F7F9; --ink:#13222E; --muted:#566775; --line:#D3DDE4;
  --lake:#1C5D86; --lake-soft:#DCEAF3; --on-lake:#FFFFFF;
  --sun:#E7A600; --sun-soft:#FFF3D1;
  --good:#1F7A4D; --good-soft:#E2F2E9; --bad:#B3362B; --bad-soft:#FBE7E4;
  --wood:#9A6B43; --wood-dark:#6E4A2C; --box:#C9A06A;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1922; --surface:#14232E; --surface-2:#1A2C39; --ink:#E6EEF3; --muted:#9BB0BF; --line:#2A3F4E;
    --lake:#6FB3DD; --lake-soft:#183448; --on-lake:#08161F;
    --sun:#F3C23F; --sun-soft:#3A2F12;
    --good:#5CC48D; --good-soft:#123323; --bad:#F2806F; --bad-soft:#3E1D19;
    --wood:#B98A5E; --wood-dark:#8A6340; --box:#B48E5C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1922; --surface:#14232E; --surface-2:#1A2C39; --ink:#E6EEF3; --muted:#9BB0BF; --line:#2A3F4E;
  --lake:#6FB3DD; --lake-soft:#183448; --on-lake:#08161F;
  --sun:#F3C23F; --sun-soft:#3A2F12;
  --good:#5CC48D; --good-soft:#123323; --bad:#F2806F; --bad-soft:#3E1D19;
  --wood:#B98A5E; --wood-dark:#8A6340; --box:#B48E5C;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 64px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.en{color:var(--muted)}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}

/* Suns (the scoring mark, after the sun on the Macedonian flag) */
.sun g,.sun circle{fill:var(--line)}
.sun.on g,.sun.on circle{fill:var(--sun)}
.suns{display:inline-flex;gap:2px;align-items:center}

/* Home */
.hero{position:relative;overflow:hidden;padding-block:12px 28px;border-bottom:1px solid var(--line);margin-bottom:8px}
.hero-sun{position:absolute;right:-56px;top:-60px;width:220px;height:220px;opacity:.9;pointer-events:none}
.hero-sun g,.hero-sun circle{fill:var(--sun)}
.sun-wrap{position:absolute;inset:0;pointer-events:none}
.hero > *:not(.sun-wrap){position:relative}
@media (max-width:520px){.hero-sun{width:150px;height:150px;right:-40px;top:-44px}}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(1.7rem,6.2vw,2.7rem);line-height:1.08;margin:.4rem 0 0;letter-spacing:-.01em;text-wrap:balance;max-width:14ch}
.hero-en{font-family:var(--font-display);font-weight:500;color:var(--lake);margin:.35rem 0 0;font-size:clamp(1rem,3.2vw,1.2rem)}
.lede{max-width:56ch;margin:1rem 0 0}
.lede .en{display:block}
.hero-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:18px}
.tally{display:inline-flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.tally b{font-size:1.05rem}
.chapter{margin-top:28px}
.ch-head{display:grid;gap:2px;margin-bottom:12px}
.ch-head h2{font-family:var(--font-display);font-weight:700;font-size:1.3rem;margin:0}
.ch-head p{margin:0}
.stops{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.stops{grid-template-columns:1fr}}
.stop{display:grid;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;transition:border-color .15s, transform .15s}
.stop:hover{border-color:var(--lake);transform:translateY(-1px)}
.stop-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stop-num{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.stop-mk{font-weight:700;font-size:1.08rem;line-height:1.25}
.stop-en{color:var(--muted);font-size:.92rem;line-height:1.3}
.stop-meta{color:var(--muted);font-size:.8rem;margin-top:4px}
.reset{margin-top:36px;display:flex;justify-content:center}

/* Buttons */
.btn{font-weight:600;border-radius:12px;padding:12px 18px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer}
.btn:hover{border-color:var(--lake)}
.btn.primary{background:var(--lake);border-color:var(--lake);color:var(--on-lake)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border-color:transparent;padding:8px 10px;color:var(--lake)}
.btn.small{font-size:.85rem;padding:8px 12px;color:var(--muted)}
.link{background:none;border:0;color:var(--lake);font-weight:600;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;justify-self:start}

/* Play */
.playbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.playbar .title{flex:1;min-width:0;font-weight:700;line-height:1.2}
.playbar .title span{display:block;font-weight:400;font-size:.85rem;color:var(--muted)}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.track{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:16px}
.fill{height:100%;background:var(--lake);border-radius:99px;transition:width .3s}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,4vw,24px);display:grid;gap:16px}
.kind{justify-self:start;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--lake);background:var(--lake-soft);border-radius:99px;padding:4px 10px}
.prompt{display:grid;gap:2px}
.q-mk{font-size:clamp(1.15rem,3.6vw,1.4rem);font-weight:600;line-height:1.35;margin:0;text-wrap:balance}
.q-en{color:var(--muted);margin:0}
.visual{display:flex;justify-content:center}
.pic{font-size:3.4rem;line-height:1}
.swatch{width:140px;height:84px;border-radius:14px;border:1px solid var(--line)}
svg.scene{width:100%;max-width:340px;height:auto}
.scene .floor{stroke:var(--line);stroke-width:2}
.scene .table{fill:var(--wood)}
.scene .ball{fill:var(--sun);stroke:var(--ink);stroke-width:1.5}
.scene .box{fill:var(--box);stroke:var(--ink);stroke-width:1.5}
.scene .box-back{fill:var(--wood-dark)}
.scene .box-line{stroke:var(--ink);stroke-width:1;opacity:.35}
.scene .lamp{fill:var(--lake)}
.scene .cord{stroke:var(--ink);stroke-width:2}
.scene .bulb{fill:var(--sun)}
svg.clock{width:150px;height:150px}
.clock .face{fill:var(--surface-2);stroke:var(--ink);stroke-width:2.5}
.clock .ticks line{stroke:var(--muted);stroke-width:2.2;stroke-linecap:round}
.clock .hh{stroke:var(--ink);stroke-width:5;stroke-linecap:round}
.clock .mh{stroke:var(--lake);stroke-width:3;stroke-linecap:round}
.clock .pin{fill:var(--ink)}
svg.flag{width:200px;max-width:100%;height:auto;border-radius:4px;box-shadow:0 0 0 1px var(--line)}

.story{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:8px}
.story-pic{font-size:1.6rem;letter-spacing:.25em}
.story-mk{margin:0;font-size:1.04rem;max-width:62ch}
.story-en{margin:0;color:var(--muted);max-width:62ch}

.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opts.long{grid-template-columns:1fr}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 16px;font-size:1.05rem;cursor:pointer;transition:border-color .15s, background .15s}
.opt:hover:not(:disabled){border-color:var(--lake);background:var(--lake-soft)}
.opt:disabled{cursor:default}
.is-right{background:var(--good-soft)!important;border-color:var(--good)!important}
.is-wrong{background:var(--bad-soft)!important;border-color:var(--bad)!important}

.match{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mcol{display:grid;gap:8px;align-content:start}
.mbtn{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font-size:1rem;cursor:pointer;text-align:center;min-height:48px;overflow-wrap:anywhere}
.mbtn.pic{font-size:1.8rem;padding:6px}
.mbtn.sel{border-color:var(--lake);background:var(--lake-soft)}
.mbtn.ok{border-color:var(--good);background:var(--good-soft);cursor:default}
.mbtn.no{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
.note{font-size:.85rem;color:var(--muted);margin:0;font-variant-numeric:tabular-nums}

.line{min-height:58px;border:1.5px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.line .ph{color:var(--muted);font-size:.9rem;padding-inline:6px}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.tile{padding:9px 13px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);font-size:1.05rem;cursor:pointer}
.line .tile{background:var(--lake-soft);border-color:var(--lake)}
.line.good .tile{background:var(--good-soft);border-color:var(--good)}
.line.bad .tile{background:var(--bad-soft);border-color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.now{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;min-height:52px}
.chip-big{font-size:1.35rem;font-weight:600;padding:8px 18px;border-radius:999px;background:var(--sun-soft);border:1.5px solid var(--sun)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.bucket{display:grid;gap:8px;align-content:start;text-align:left;background:var(--surface-2);border:1.5px solid var(--line);border-radius:14px;padding:12px;min-height:130px;cursor:pointer}
.bucket:hover:not(:disabled){border-color:var(--lake)}
.bucket:disabled{cursor:default}
.bucket .bh{font-weight:700;line-height:1.2}
.bucket .bh span{display:block;font-weight:400;font-size:.85rem;color:var(--muted)}
.bucket.flash-ok{border-color:var(--good);background:var(--good-soft)}
.bucket.flash-no{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
.drops{display:flex;flex-wrap:wrap;gap:6px}
.drop{font-size:.9rem;padding:3px 9px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.drop.wrong{background:var(--bad-soft);border-color:var(--bad)}

.tf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.feedback{border-radius:14px;padding:14px 16px;display:grid;gap:6px;border:1.5px solid}
.feedback.good{background:var(--good-soft);border-color:var(--good)}
.feedback.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb-head{font-weight:700;margin:0}
.feedback.good .fb-head{color:var(--good)}
.feedback.bad .fb-head{color:var(--bad)}
.feedback p{margin:0}
.feedback .btn{justify-self:start;margin-top:6px}

.result{text-align:center;display:grid;gap:10px;justify-items:center;padding-block:12px}
.result h2{font-family:var(--font-display);font-weight:700;font-size:clamp(1.4rem,5vw,1.9rem);margin:0;text-wrap:balance}
.big-score{font-family:var(--font-display);font-size:2.6rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.missed{display:grid;gap:8px;margin-top:18px}
.missed h3{margin:0;font-size:1rem}
.miss{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.miss p{margin:0}
.miss .ans{font-weight:600;color:var(--good)}
.end-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px}

/* Language switch */
.hero-controls{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-top:18px}
.hero-controls .levels{margin-top:0}
.langs{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.langs-label{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-inline:8px 4px}
.lang{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-weight:700;font-size:.85rem;cursor:pointer;color:var(--muted)}
.lang:hover{background:var(--surface-2);color:var(--ink)}
.lang.on{background:var(--sun);color:#13222E}

/* Levels */
.levels{display:flex;flex-wrap:wrap;gap:4px;margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;width:fit-content;max-width:100%}
.lvl{display:grid;text-align:left;border:0;background:transparent;border-radius:10px;padding:8px 14px;cursor:pointer;line-height:1.25}
.lvl:hover{background:var(--surface-2)}
.lvl.on{background:var(--lake);color:var(--on-lake)}
.lvl-mk{font-weight:700}
.lvl-en{font-size:.78rem;opacity:.85}
.soon{margin-top:20px}
.soon-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.soon-list li{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:2px}
.story-mk,.story-en{white-space:pre-line}
.street{display:flex;gap:8px;align-items:flex-end;padding-inline:8px;border-bottom:4px solid var(--line);max-width:100%}
.bldg{display:grid;justify-items:center;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;padding:10px 10px 8px;min-width:0;flex:1 1 0}
.bldg-ic{font-size:2rem;line-height:1}
.bldg-lb{font-size:.85rem;color:var(--muted)}

@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap"><main id="view" aria-live="polite"></main></div>

<script>
/* ---------- Content ---------- */
const STORIES = {
  marko: { pic: "🏖️", mk: "Здраво! Јас сум Марко. Јас сум од Скопје, но сега сум во Охрид. Мојата сестра Ана е со мене. Ние сме на одмор и сме многу среќни!",
           en: "Hi! I'm Marko. I'm from Skopje, but now I'm in Ohrid. My sister Ana is with me. We're on holiday and we're very happy!" },
  bag:   { pic: "🎒 📖 🍾 🎧 🔑", mk: "Што има во ранецот на Елена? Таа има книга, шише вода, слушалки и клучеви. Таа нема наочари и нема пари!",
           en: "What's in Elena's backpack? She has a book, a bottle of water, headphones and keys. She has no glasses and no money!" },
  ana:   { pic: "🌅 🚌 🥗 🐕 📺", mk: "Ана станува во шест часот. Пие чај со мед и јаде леб со ајвар. Во осум часот оди на работа со автобус. За ручек јаде салата со колегите. Попладне шета со своето куче во паркот. Навечер готви и гледа серија. Си легнува во десет часот.",
           en: "Ana gets up at six o'clock. She drinks tea with honey and eats bread with ajvar. At eight she goes to work by bus. For lunch she eats a salad with her colleagues. In the afternoon she walks her dog in the park. In the evening she cooks and watches a series. She goes to bed at ten." }
};

const CHAPTERS_1 = [
  { city: "Скопје",   mk: "Елена пристигнува во главниот град.",        en: "Elena arrives in the capital." },
  { city: "Охрид",    mk: "Викенд на езерото.",                            en: "A weekend by the lake." },
  { city: "Битола",   mk: "Кафе на Широк сокак со нови пријатели.",        en: "Coffee on Širok Sokak with new friends." },
  { city: "Струмица", mk: "Пазар полн со бои и вкусна храна.",             en: "A market full of colour and good food." },
  { city: "Крушево",  mk: "Пат во планините и ручек кај баба.",            en: "A trip to the mountains and lunch at grandma's." },
  { city: "Штип",     mk: "Голема семејна вечера.",                        en: "A big family dinner." }
];

/* In every "mc" question the first option is the correct one; options are shuffled on screen. */
const STOPS_1 = [
 { ch:0, mk:"Азбука", en:"Alphabet", qs:[
  {t:"mc", q:"Колку букви има македонската азбука?", en:"How many letters does the Macedonian alphabet have?", o:["31","26","30","33"], why:"5 vowels (а, е, и, о, у) + 26 consonants = 31."},
  {t:"mc", q:"Која буква НЕ е самогласка?", en:"Which letter is NOT a vowel?", o:["ј","а","у","о"], why:"ј is a consonant. It sounds like y in ‘yes’."},
  {t:"match", q:"Поврзи го зборот со сликата.", en:"Match each word to its picture.", p:[["жаба","🐸"],["ѕвезда","⭐"],["око","👁️"],["лук","🧄"],["чај","🍵"]]},
  {t:"mc", q:"Кој збор нема ниту една самогласка?", en:"Which word has no vowel at all?", o:["врв","вода","сон","маса"], why:"врв means ‘peak’. In Macedonian р can carry a syllable: врв, прст, крв."},
  {t:"mc", q:"Која буква звучи како j во англискиот збор „jungle“?", en:"Which letter sounds like the j in ‘jungle’?", o:["џ","ј","ж","ѕ"], why:"џ = j in ‘jungle’. Careful: ј sounds like y in ‘yes’."},
  {t:"mc", q:"Која буква звучи како ny во „canyon“?", en:"Which letter sounds like ny in ‘canyon’?", o:["њ","н","љ","ј"], why:"њ is a soft n, like Spanish ñ. Its partner љ is a soft l."},
  {t:"mc", q:"Која буква е меко к, како cu во „cute“?", en:"Which letter is the soft k, like cu in ‘cute’?", o:["ќ","к","г","ѓ"], why:"ќ is a soft k (ќерка = daughter). ѓ is its soft g partner."},
  {t:"mc", q:"Во кој збор има буква љ?", en:"Which word contains the letter љ?", o:["љубопитен","лубеница","њива","јаболко"], why:"љубопитен means ‘curious’. лубеница (watermelon) has a plain л."}
 ]},
 { ch:0, mk:"Поздрави", en:"Greetings", qs:[
  {t:"mc", q:"Часот е 8 наутро. Елена го гледа соседот. Што вели?", en:"It's 8 a.m. Elena sees her neighbour. What does she say?", o:["Добро утро!","Добра ноќ!","Добра вечер!","Добредојдовте!"], why:"Добро утро = Good morning."},
  {t:"mc", q:"Елена излегува од пекарата. Што ѝ вели на продавачката?", en:"Elena is leaving the bakery. What does she say to the shop assistant?", o:["Пријатно!","Добредојде!","Добар ден!","Наздравје!"], why:"Пријатно is the polite goodbye when you leave a place."},
  {t:"mc", q:"Ти си на часот. Како го прашуваш новиот професор за неговото име?", en:"You're in class. How do you ask the new teacher his name?", o:["Како се викате?","Како се викаш?","Колку години имаш?","Од кој град си?"], why:"With a teacher, use the formal form: Како се викате?"},
  {t:"mc", pic:"🤧", q:"Марко кива. Што му велиш?", en:"Marko sneezes. What do you say to him?", o:["Наздравје!","Фала!","Чао!","Добро утро!"], why:"Наздравје means ‘bless you’, and also ‘cheers’ when you raise a glass."},

 { ch:2, mk:"Лични заменки", en:"Pronouns", qs:[

  {t:"mc", pic:"📮", q:"Јас не ___ каде е поштата. (знае)", en:"I don't know where the post office is.", o:["знам","знаам","знае","знаеш"], why:"знае is a little irregular: јас знам."},
  {t:"mc", q:"Ние ___ да дојдеме утре. (може)", en:"We can come tomorrow.", o:["можеме","можам","можат","можете"], why:"ние + -ме → можеме."},
  {t:"mc", pic:"😂", q:"Децата ___ на шегата. (се смее)", en:"The children laugh at the joke.", o:["се смеат","се смее","се смееме","се смеам"], why:"децата = тие → се смеат."},
  {t:"sort", q:"А-група или е-група?", en:"а-group or е-group?", b:["а-група / а-group","е-група / е-group"], i:[["чита",0],["пее",1],["гледа",0],["живее",1],["слуша",0],["пие",1],["игра",0],["јаде",1]]},
  {t:"order", en:"Where do your parents live?", w:["Каде","живеат","твоите","родители?"]}
 ]},
 { ch:1, mk:"Глаголи на -и", en:"и-group verbs", qs:[
  {t:"mc", pic:"📚", q:"Јас ___ македонски секој ден. (учи)", en:"I study Macedonian every day.", o:["учам","учи","учиш","учат"], why:"и-group: јас + -ам → учам."},
  {t:"mc", q:"Што ___ ти денес? (прави)", en:"What are you doing today?", o:["правиш","правам","прави","прават"], why:"ти + -ш → правиш."},
  {t:"mc", pic:"🏥", q:"Бојан ___ во болница. (работи)", en:"Bojan works in a hospital.", o:["работи","работам","работат","работиш"], why:"тој: no ending → работи."},
  {t:"mc", pic:"🚶", q:"Ние ___ на работа пешки. (оди)", en:"We walk to work.", o:["одиме","одите","одат","одам"], why:"ние + -ме → одиме."},
  {t:"mc", pic:"🚪", q:"Тие ___ пред вратата. (стои)", en:"They are standing in front of the door.", o:["стојат","стоат","стои","стоиме"], why:"стои gets a ј: јас стојам, тие стојат."},
  {t:"mc", pic:"🌧️", q:"Баба Ружа ___ дека ќе врне. (мисли)", en:"Grandma Ruža thinks it will rain.", o:["мисли","мислам","мислат","мислиш"], why:"таа: no ending → мисли."},
  {t:"mc", pic:"🏎️", q:"Вие ___ многу брзо! (вози)", en:"You drive very fast!", o:["возите","возиме","возат","возиш"], why:"вие + -те → возите."},
  {t:"sort", q:"Која група?", en:"Which group does each verb belong to?", b:["а-група / а","е-група / е","и-група / и"], i:[["зборува",0],["пие",1],["учи",2],["чека",0],["живее",1],["работи",2],["игра",0],["знае",1],["прави",2]]},
  {t:"match", q:"Како се вели со „јас“?", en:"Match each verb to its ‘јас’ (I) form.", p:[["учи","учам"],["пие","пијам"],["знае","знам"],["стои","стојам"],["оди","одам"],["чита","читам"]]}
 ]},
 { ch:2, mk:"Може, мора, треба", en:"Can, must, need", qs:[
  {t:"mc", pic:"🤒", q:"Јас не ___ да дојдам денес, болна сум.", en:"I can't come today, I'm ill. (a woman)", o:["можам","може","можеш","можеме"], why:"јас можам. After може comes да + verb."},
  {t:"mc", pic:"⏰", q:"Утре ___ да станам рано, имам испит.", en:"Tomorrow I have to get up early, I have an exam.", o:["морам","морате","мораат","мораме"], why:"мора = must / have to: јас морам."},
  {t:"mc", pic:"🍞", q:"___ да купиме леб и млеко.", en:"We need to buy bread and milk.", o:["Треба","Можат","Мораш","Сака"], why:"Треба да… = need to / should. треба never changes."},
  {t:"mc", pic:"☂️", q:"Ми ___ чадор, врне дожд!", en:"I need an umbrella, it's raining!", o:["треба","мора","може","сака"], why:"Ми треба = I need (literally ‘to me is needed’)."},
  {t:"mc", pic:"🏖️", q:"Сакам ___ одам на плажа.", en:"I want to go to the beach.", o:["да","ли","на","во"], why:"After сака, може, мора and треба the next verb comes with да."},
  {t:"mc", q:"Можеш ли да ми ___? (помогне)", en:"Can you help me?", o:["помогнеш","помогне","помогнам","помогнат"], why:"Both verbs go with ти: можеш … да помогнеш."},
  {t:"mc", pic:"🎬", q:"Тие сакаат ___ во кино.", en:"They want to go to the cinema.", o:["да одат","да одам","одат","да оди"], why:"тие сакаат да одат: both verbs in the тие form."},
  {t:"order", en:"Can I have a glass of water?", w:["Може","ли","една","чаша","вода?"]},
  {t:"order", en:"We have to go home.", w:["Мораме","да","одиме","дома."]}
 ]},
 { ch:2, mk:"Хобија", en:"Hobbies", qs:[
  {t:"match", q:"Поврзи го хобито со сликата.", en:"Match each hobby to its picture.", p:[["пливање","🏊"],["трчање","🏃"],["шах","♟️"],["планинарење","🥾"],["велосипедизам","🚴"],["пеење","🎤"]]},
  {t:"match", q:"Спортови со топка.", en:"Ball sports: match the pictures.", p:[["фудбал","⚽"],["кошарка","🏀"],["одбојка","🏐"],["тенис","🎾"]]},
  {t:"mc", pic:"🏊", q:"Ивана сака да ___ во езерото. (плива)", en:"Ivana likes to swim in the lake.", o:["плива","пливам","пливање","пливаат"], why:"таа сака да плива: the second verb also goes with таа."},
  {t:"mc", q:"Што правиш во слободното време?", en:"What do you do in your free time?", o:["Играм шах со мојот дедо.","Имам триесет години.","Јас сум од Велес.","Во осум часот."], why:"слободно време = free time."},

  {t:"sort", q:"Со топка или без топка?", en:"With a ball or without one?", b:["со топка / with a ball","без топка / no ball"], i:[["фудбал",0],["кошарка",0],["одбојка",0],["тенис",0],["пливање",1],["трчање",1],["шах",1],["јога",1]]},
  {t:"mc", pic:"⚽", q:"Марко ___ фудбал секоја сабота.", en:"Marko plays football every Saturday.", o:["игра","игри","играње","играат"], why:"тој игра. играње is the noun ‘playing’."},
  {t:"order", en:"In my free time I like to read.", w:["Во","слободното","време","сакам","да","читам."]}
 ]},
 { ch:2, mk:"Гроздобер", en:"Grape harvest (reading)", qs:[
  {t:"tf", s:"grozdober", q:"Грозјето го собираат во септември.", en:"They pick the grapes in September.", a:true, why:"Во септември… They pick (собираат) the grapes."},
  {t:"tf", s:"grozdober", q:"Дедо Трајко работи најмногу.", en:"Grandpa Trajko works the most.", a:false, why:"Дедо Трајко не може да работи многу."},
  {t:"tf", s:"grozdober", q:"Баба Цвета готви ручек за сите.", en:"Grandma Cveta cooks lunch for everyone.", a:true, why:"Баба Цвета готви ручек за сите."},

  {t:"mc", s:"grozdober", q:"Кој му помага на дедо Трајко?", en:"Who helps Grandpa Trajko?", o:["Јована и Бојан","Баба Цвета","Никој","Марко"], why:"Јована и Бојан му помагаат."},
  {t:"mc", s:"grozdober", q:"Што пијат навечер во дворот?", en:"What do they drink in the yard in the evening?", o:["домашен сок од грозје","кафе со млеко","чај со мед","ладна вода"], why:"домашен сок од грозје = homemade grape juice."},
  {t:"match", q:"Зборови од текстот.", en:"Words from the text: match them.", p:[["грозје","grapes"],["двор","yard"],["дожд","rain"],["домашен","homemade"],["помага","helps"],["собира","picks"]]},
  {t:"order", en:"Grandma cooks lunch for everyone.", w:["Баба","готви","ручек","за","сите."]}
 ]},
 { ch:3, mk:"Времето", en:"The weather", qs:[
  {t:"mc", pic:"☀️", q:"Какво е времето?", en:"What's the weather like?", o:["Сончево е.","Врне дожд.","Облачно е.","Вее снег."], why:"сонце = sun, so сончево = sunny."},
  {t:"mc", pic:"🌧️", q:"Какво е времето?", en:"What's the weather like?", o:["Врне дожд.","Сончево е.","Ветровито е.","Топло е."], why:"дожд = rain; врне дожд = it's raining."},
  {t:"mc", pic:"❄️", q:"Какво е времето?", en:"What's the weather like?", o:["Вее снег.","Врне дожд.","Сончево е.","Топло е."], why:"снег = snow; вее снег = it's snowing."},
  {t:"mc", pic:"💨", q:"Какво е времето?", en:"What's the weather like?", o:["Дува ветер.","Вее снег.","Сончево е.","Облачно е."], why:"ветер = wind; дува = blows. You can also say: Ветровито е."},
  {t:"mc", pic:"☁️", q:"Какво е времето?", en:"What's the weather like?", o:["Облачно е.","Сончево е.","Вее снег.","Топло е."], why:"облак = cloud, so облачно = cloudy."},
  {t:"mc", pic:"🌡️", q:"Триесет и пет степени! Многу е ___.", en:"35 degrees! It's very ___.", o:["топло","ладно","свежо","облачно"], why:"степени = degrees; топло = warm / hot."},
  {t:"mc", q:"Денес е многу свежо ___ е облачно.", en:"It's very chilly today because it's cloudy.", o:["затоа што","но","или","нели"], why:"затоа што (or бидејќи) = because."},
  {t:"match", q:"Поврзи.", en:"Match the weather words.", p:[["сонце","sun"],["облак","cloud"],["дожд","rain"],["снег","snow"],["ветер","wind"],["ладно","cold"]]},
  {t:"order", en:"Today the weather is sunny and warm.", w:["Денес","времето","е","сончево","и","топло."]}
 ]},
 { ch:3, mk:"Иднина со ќе", en:"The future with ќе", qs:[
  {t:"mc", pic:"🏔️", q:"Утре јас ___ во Маврово.", en:"Tomorrow I will go to Mavrovo.", o:["ќе одам","ќе оди","одам ќе","ќе одиме"], why:"ќе + the normal present form: ќе одам."},
  {t:"mc", q:"Што ___ викендов?", en:"What will you do this weekend? (to a friend)", o:["ќе правиш","ќе правам","ќе прави","правиш ќе"], why:"ќе comes before the verb: ќе правиш."},
  {t:"mc", pic:"⛷️", q:"Ние ___ на скијање во јануари.", en:"We will go skiing in January.", o:["ќе одиме","ќе одат","ќе одам","ќе одите"], why:"ние → ќе одиме."},
  {t:"mc", pic:"🌧️", q:"Утре ___.", en:"It will rain tomorrow.", o:["ќе врне","врне ќе","ќе врнат","ќе врнам"], why:"ќе врне = it will rain."},
  {t:"mc", pic:"🎉", q:"Јас ___ дојдам на забавата, работам.", en:"I won't come to the party, I'm working.", o:["нема да","не ќе","ќе не","немам да"], why:"‘Won't’ is нема да + verb, never „не ќе“."},
  {t:"mc", q:"Тие ___ останат три дена во хотелот.", en:"They will stay three days at the hotel.", o:["ќе","да","ли","нема"], why:"ќе останат = they will stay."},
  {t:"sort", q:"Сега или подоцна?", en:"Now or later?", b:["сега / now","подоцна / later"], i:[["Јадам.",0],["Ќе јадам.",1],["Денес врне.",0],["Утре ќе врне.",1],["Читам книга.",0],["Ќе се видиме!",1]]},
  {t:"order", en:"Tonight we will eat at a restaurant.", w:["Вечерва","ќе","јадеме","во","ресторан."]},
  {t:"order", en:"Ivana won't work on Sunday.", w:["Ивана","нема","да","работи","во","недела."]}
 ]},
 { ch:3, mk:"Викенд во Маврово", en:"A weekend in Mavrovo (reading)", qs:[
  {t:"tf", s:"mavrovo", q:"Марко и Ивана ќе патуваат во петок.", en:"Marko and Ivana will travel on Friday.", a:true, why:"Во петок Марко и Ивана ќе патуваат…"},
  {t:"tf", s:"mavrovo", q:"Во сабота ќе биде сончево.", en:"It will be sunny on Saturday.", a:false, why:"Во сабота ќе вее снег. It will be sunny on Sunday."},
  {t:"tf", s:"mavrovo", q:"Во сабота ќе скијаат цел ден.", en:"On Saturday they will ski all day.", a:true, why:"Во сабота тие ќе скијаат цел ден."},
  {t:"tf", s:"mavrovo", q:"Во недела ќе останат во хотелот.", en:"On Sunday they will stay at the hotel.", a:false, why:"They will walk by the lake and go back to Skopje."},
  {t:"mc", s:"mavrovo", q:"Каде ќе седат навечер?", en:"Where will they sit in the evening?", o:["покрај каминот","во колата","на плажа","во болница"], why:"покрај каминот = by the fireplace."},
  {t:"mc", s:"mavrovo", q:"Што ќе пијат навечер?", en:"What will they drink in the evening?", o:["топол чај","ладен сок","кафе со мраз","ладна вода"], why:"топол чај = hot tea."},
  {t:"mc", s:"mavrovo", q:"Кога ќе се вратат во Скопје?", en:"When will they go back to Skopje?", o:["во недела","во петок","во сабота","во понеделник"], why:"Во недела … ќе се вратат во Скопје."},
  {t:"order", en:"On Sunday it will be sunny.", w:["Во","недела","ќе","биде","сончево."]}
 ]},
 { ch:4, mk:"Го, ја, ги", en:"Him, her, them", qs:[
  {t:"mc", pic:"📖", q:"Каде е книгата? — Не ___ гледам.", en:"Where's the book? — I don't see it.", o:["ја","го","ги","ме"], why:"книга is feminine → ја."},
  {t:"mc", pic:"📱", q:"Каде е телефонот? — ___ имам во ташната.", en:"Where's the phone? — I have it in my bag.", o:["Го","Ја","Ги","Те"], why:"телефон is masculine → го."},
  {t:"mc", pic:"🍓", q:"Ги сакаш ли јагодите? — Да, многу ___ сакам.", en:"Do you like strawberries? — Yes, I love them.", o:["ги","го","ја","ме"], why:"plural → ги."},
  {t:"mc", q:"Ивана, Марко ___ бара!", en:"Ivana, Marko is looking for you!", o:["те","ме","го","ве"], why:"тебе → те."},
  {t:"mc", q:"Деца, баба Ружа ___ чека!", en:"Kids, Grandma Ruža is waiting for you!", o:["ве","те","ги","ме"], why:"вас (you, plural) → ве."},
  {t:"mc", pic:"🍲", q:"Баба ___ вика на ручек.", en:"Grandma is calling us to lunch.", o:["нѐ","ги","ме","ве"], why:"нас → нѐ. It's written with an accent so it isn't confused with не = not."},
  {t:"mc", q:"Кое е точно?", en:"Which is correct? (I'm reading the book.)", o:["Ја читам книгата.","Читам ја книгата.","Ја читам книга.","Го читам книгата."], why:"When the object has ‘the’ (книгата), Macedonian also puts ја before the verb."},
  {t:"mc", q:"Кое е точно?", en:"Which is correct? (I know him.)", o:["Го познавам.","Познавам го.","Ја познавам.","Ги познавам."], why:"The short form goes before the verb: го познавам."},
  {t:"match", q:"Долга и кратка форма.", en:"Match each long form to its short form.", p:[["мене","ме"],["тебе","те"],["него","го"],["неа","ја"],["нас","нѐ"],["вас","ве"]]},
  {t:"order", en:"I'm looking for the keys.", w:["Ги","барам","клучевите."]}
 ]},
 { ch:4, mk:"Ми, ти, му, ѝ", en:"To me, to you, to him, to her", qs:[
  {t:"mc", pic:"💐", q:"Ивана има роденден. ___ купувам цвеќе.", en:"It's Ivana's birthday. I'm buying her flowers.", o:["Ѝ","Му","Им","Ми"], why:"to her = ѝ, with an accent so it isn't confused with и = and."},
  {t:"mc", pic:"👓", q:"Дедо Трајко не гледа добро. ___ читам весник.", en:"Grandpa Trajko can't see well. I read the newspaper to him.", o:["Му","Ѝ","Ни","Го"], why:"to him = му."},
  {t:"mc", pic:"🥪", q:"Децата се гладни. ___ давам сендвичи.", en:"The children are hungry. I'm giving them sandwiches.", o:["Им","Ги","Му","Ви"], why:"to them = им. (ги = them, when nothing is given ‘to’ them.)"},
  {t:"mc", pic:"🌊", q:"___ се допаѓа Охрид.", en:"I like Ohrid.", o:["Ми","Ме","Јас","Ние"], why:"Ми се допаѓа = I like (literally ‘it pleases me’)."},
  {t:"mc", q:"Дали ___ се допаѓа македонската храна?", en:"Do you like Macedonian food? (to a friend)", o:["ти","те","ми","ви"], why:"to you = ти."},
  {t:"mc", pic:"✉️", q:"Ние ___ пишуваме на баба секоја недела.", en:"We write to grandma every week.", o:["ѝ","ја","му","ги"], why:"на баба = to grandma, so ѝ."},
  {t:"mc", pic:"🥶", q:"___ е ладно.", en:"I'm cold.", o:["Ми","Ме","Јас","Ние"], why:"Ми е ладно = I'm cold (literally ‘to me it's cold’)."},
  {t:"match", q:"Долга и кратка форма.", en:"Match each long form to its short form.", p:[["мене","ми"],["тебе","ти"],["нему","му"],["нејзе","ѝ"],["нам","ни"],["вам","ви"]]},
  {t:"order", en:"I like this song.", w:["Ми","се","допаѓа","оваа","песна."]}
 ]},
 { ch:4, mk:"Мој, твој, негов", en:"My, your, his", qs:[
  {t:"mc", pic:"🐕", q:"Ова е ___ куче. (my)", en:"This is my dog.", o:["моето","мојот","мојата","моите"], why:"куче is neuter: моето."},
  {t:"mc", q:"___ сестра живее во Велес. (my)", en:"My sister lives in Veles.", o:["Мојата","Мојот","Моето","Моите"], why:"сестра is feminine: мојата."},
  {t:"mc", pic:"🔑", q:"Каде се ___ клучеви? (your)", en:"Where are your keys?", o:["твоите","твојот","твојата","твоето"], why:"клучеви is plural: твоите."},
  {t:"mc", pic:"🚗", q:"Тоа е ___ автомобил. (his)", en:"That's his car.", o:["неговиот","нејзиниот","нивниот","нашиот"], why:"his = негов → неговиот."},
  {t:"mc", pic:"🏡", q:"Ова е ___ куќа. (her)", en:"This is her house.", o:["нејзината","неговата","нејзиниот","нашата"], why:"her = нејзин; куќа is feminine → нејзината."},
  {t:"mc", q:"___ град е мал, но убав. (our)", en:"Our town is small but beautiful.", o:["Нашиот","Нашата","Нашето","Нашите"], why:"град is masculine: нашиот."},
  {t:"mc", q:"„мајка ми“ значи…", en:"What does ‘мајка ми’ mean?", o:["my mother","your mother","to my mother","her mother"], why:"With family words, the short form often comes after the noun: мајка ми, брат ти, сестра ѝ."},
  {t:"mc", q:"„брат му“ значи…", en:"What does ‘брат му’ mean?", o:["his brother","my brother","her brother","their brother"], why:"му = his: брат му = his brother."},
  {t:"sort", q:"Мојот, мојата или моето?", en:"My: masculine, feminine or neuter?", b:["мојот","мојата","моето"], i:[["телефон",0],["кола",1],["куче",2],["пријател",0],["книга",1],["палто",2]]}
 ]},
 { ch:5, mk:"Во градот", en:"Around town", qs:[
  {t:"match", q:"Што има во градот?", en:"What's in town? Match the pictures.", p:[["болница","🏥"],["аптека","💊"],["пекара","🥐"],["банка","🏦"],["музеј","🏛️"],["семафор","🚦"]]},

  { n: 1, cefr: "A1", chapters: CHAPTERS_1, stops: STOPS_1 },
  { n: 2, cefr: "A2", chapters: CHAPTERS_2, stops: STOPS_2 },
  { n: 3, cefr: "A2+", soon: true, topics: [
    ["Минато време", "Past tenses"], ["Свршени и несвршени глаголи", "Perfective and imperfective verbs"],
    ["Л-форма", "The л-form"], ["Заповеден начин", "Giving instructions"], ["Повратни глаголи со се", "Reflexive verbs with се"],
    ["Би сакал / би сакала", "Would like"], ["Поголем, најголем", "Bigger, biggest"], ["Опис на луѓе", "Describing people"],
    ["Цар Самоил", "Tsar Samoil (reading)"] ] }
];
LEVELS.forEach(L => (L.stops || []).forEach((s, i) => { s.n = i + 1; s.id = `${L.n}-${i + 1}`; }));

/* ---------- Helpers ---------- */
const KEY = "mk-suns-v2", LKEY = "mk-level";
let progress = (() => {
  try {
    const cur = JSON.parse(localStorage.getItem(KEY));
    if (cur) return cur;
    const old = JSON.parse(localStorage.getItem("mk-level1-suns-v1")) || {};
    const out = {}; for (const [k, v] of Object.entries(old)) out[`1-${k}`] = v; return out;
  } catch (e) { return {}; }
})();
function save() { try { localStorage.setItem(KEY, JSON.stringify(progress)); } catch (e) {} }
let level = (() => { try { const v = +localStorage.getItem(LKEY); return LEVELS.some(L => L.n === v && !L.soon) ? v : 1; } catch (e) { return 1; } })();
const LV = (n = level) => LEVELS.find(L => L.n === n);

function h(tag, props, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, "");
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  for (const k of kids.flat()) { if (k == null || k === false) continue; n.append(k.nodeType ? k : document.createTextNode(String(k))); }
  return n;
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const pad = n => String(n).padStart(2, "0");
const isPic = s => /\p{Extended_Pictographic}/u.test(s) && !/[\p{L}]/u.test(s);
const split = s => { const p = s.split(" / "); return [p[0], p[1] || ""]; };

const RAYS = (() => { let s = ""; for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4; const p = (r, d) => [12 + r * Math.cos(a + d), 12 + r * Math.sin(a + d)].map(v => v.toFixed(2)).join(","); s += `<polygon points="${p(5.3,-0.34)} ${p(11.7,-0.2)} ${p(11.7,0.2)} ${p(5.3,0.34)}"/>`; } return s; })();
const sunSvg = (on, size = 18, cls = "sun") => `<svg class="${cls} ${on ? "on" : ""}" width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true"><g>${RAYS}</g><circle cx="12" cy="12" r="4.4"/></svg>`;
const sunsRow = (n, size = 16) => h("span", { class: "suns", role: "img", "aria-label": `${n} of 3 suns`, html: [0, 1, 2].map(i => sunSvg(i < n, size)).join("") });

function clockSvg(t) {
  const [H, M] = t.split(":").map(Number);
  const rad = d => d * Math.PI / 180, ha = rad(((H % 12) + M / 60) * 30), ma = rad(M * 6);
  let ticks = "";
  for (let k = 0; k < 12; k++) { const a = rad(k * 30), r1 = k % 3 ? 40 : 35; ticks += `<line x1="${(50 + r1 * Math.sin(a)).toFixed(1)}" y1="${(50 - r1 * Math.cos(a)).toFixed(1)}" x2="${(50 + 44 * Math.sin(a)).toFixed(1)}" y2="${(50 - 44 * Math.cos(a)).toFixed(1)}"/>`; }
  return `<svg class="clock" viewBox="0 0 100 100" role="img" aria-label="Clock"><circle class="face" cx="50" cy="50" r="47"/><g class="ticks">${ticks}</g>` +
    `<line class="hh" x1="50" y1="50" x2="${(50 + 22 * Math.sin(ha)).toFixed(1)}" y2="${(50 - 22 * Math.cos(ha)).toFixed(1)}"/>` +
    `<line class="mh" x1="50" y1="50" x2="${(50 + 34 * Math.sin(ma)).toFixed(1)}" y2="${(50 - 34 * Math.cos(ma)).toFixed(1)}"/><circle class="pin" cx="50" cy="50" r="3.2"/></svg>`;
}
function flagSvg() {
  const c = "100,50";
  const rays = [[`18,0`,`0,0`,`0,9`],[`89,0`,`111,0`],[`182,0`,`200,0`,`200,9`],[`200,40`,`200,60`],[`200,91`,`200,100`,`182,100`],[`111,100`,`89,100`],[`18,100`,`0,100`,`0,91`],[`0,60`,`0,40`]]
    .map(p => `<polygon points="${c} ${p.join(" ")}"/>`).join("");
  return `<svg class="flag" viewBox="0 0 200 100" role="img" aria-label="Flag"><rect width="200" height="100" fill="#D20000"/><g fill="#FFE600">${rays}</g><circle cx="100" cy="50" r="17" fill="#D20000"/><circle cx="100" cy="50" r="13.5" fill="#FFE600"/></svg>`;
}
function sceneSvg(kind) {
  const table = `<g class="table"><rect x="96" y="84" width="128" height="10" rx="2"/><rect x="108" y="94" width="8" height="66"/><rect x="204" y="94" width="8" height="66"/></g>`;
  const ball = (x, y, r = 13) => `<circle class="ball" cx="${x}" cy="${y}" r="${r}"/>`;
  const box = (x, y, w, hh) => `<rect class="box" x="${x}" y="${y}" width="${w}" height="${hh}" rx="2"/>`;
  const parts = {
    na: table + ball(160, 71),
    pod: table + ball(160, 147),
    do: table + ball(262, 147),
    nad: table + `<line class="cord" x1="160" y1="0" x2="160" y2="26"/><polygon class="lamp" points="138,50 182,50 172,26 148,26"/><circle class="bulb" cx="160" cy="54" r="5"/>`,
    vo: `<rect class="box-back" x="118" y="92" width="84" height="10" rx="2"/>` + ball(160, 98) + box(112, 100, 96, 60) + `<line class="box-line" x1="112" y1="114" x2="208" y2="114"/>`,
    zad: ball(207, 98, 17) + box(112, 96, 96, 64) + `<line class="box-line" x1="112" y1="110" x2="208" y2="110"/>`,
    pomegju: box(52, 104, 76, 56) + box(192, 104, 76, 56) + ball(160, 147)
  };
  return `<svg class="scene" viewBox="0 0 320 172" role="img" aria-label="Picture"><line class="floor" x1="10" y1="160" x2="310" y2="160"/>${parts[kind]}</svg>`;
}

eutre : чие, et ова.", "Whose keys are these?": "À qui sont ces clés ?", "клучеви is plural: чии, and овие.": "клучеви est au pluriel : чии, et овие.", "This house is very old.": "Cette maison est très vieille.", "куќа is feminine: оваа. Masculine овој, neuter ова, plural овие.": "куќа est féminin : оваа. Masculin овој, neutre ова, pluriel овие.", "‘This’: masculine, feminine or neuter?": "« Ce / cette » : masculin, féminin ou neutre ?", "Yes/no questions": "Questions oui / non", "Make it a question: ‘You speak English.’": "Transforme en question : « Tu parles anglais. »", "Дали at the start turns a sentence into a yes/no question.": "Дали au début transforme une phrase en question oui / non.", "Which question is correct? (Do you want coffee?)": "Quelle question est correcte ? (Tu veux un café ?)", "ли comes right after the verb: Сакаш ли…?": "ли se place juste après le verbe : Сакаш ли…?", "It's a nice day today, isn't it?": "Il fait beau aujourd’hui, n’est-ce pas ?", "нели at the end = isn't it? / right?": "нели à la fin = n’est-ce pas ? / hein ?", "You're coming with us, right?": "Tu viens avec nous, hein ?", "нели asks the other person to confirm.": "нели demande à l’autre de confirmer.", "The seller has tomatoes.": "Le vendeur a des tomates.", "The tomatoes cost sixty denars.": "Les tomates coûtent soixante denars.", "Осумдесет денари: eighty.": "Осумдесет денари : quatre-vingts.", "The seller also has peppers.": "Le vendeur a aussi des poivrons.", "Немаме, за жал: unfortunately not.": "Немаме, за жал : malheureusement non.", "Are you ready? (to a woman)": "Tu es prête ? (à une femme)", "Your brother lives in Veles, right?": "Ton frère habite à Veles, n’est-ce pas ?", "а-group verbs": "Verbes du groupe en -а", "I read the newspaper every morning.": "Je lis le journal tous les matins.", "а-group: јас + -м → читам.": "Groupe en -а : јас + -м → читам.", "We listen to music in the car.": "Nous écoutons de la musique dans la voiture.", "They play football in the park.": "Ils jouent au foot dans le parc.", "тие + -ат → играат (two а's).": "тие + -ат → играат (deux а).", "You speak Macedonian very well!": "Vous parlez très bien macédonien !", "You are writing a letter to grandma.": "Tu écris une lettre à grand-mère.", "Ivana is waiting for the bus at the stop.": "Ivana attend le bus à l’arrêt.", "тој / таа: no ending → чека.": "тој / таа : pas de terminaison → чека.", "Match each person to the right form of гледа (watch).": "Associe chaque personne à la bonne forme de гледа (regarder).", "We go shopping on Saturday.": "Nous faisons les courses le samedi.", "е-group verbs": "Verbes du groupe en -е", "I drink tea with lemon.": "Je bois du thé au citron.", "пие → јас пијам: a ј comes in.": "пие → јас пијам : un ј apparaît.", "You sing very nicely!": "Tu chantes très bien !", "Where do you live? (plural or formal)": "Où habitez-vous ? (pluriel ou politesse)", "They eat kebapi with onion.": "Ils mangent des kebapi avec de l’oignon.", "е-group: тие → јадат, not јадеат.": "Groupe en -е : тие → јадат, et non јадеат.", "I don't know where the post office is.": "Je ne sais pas où est la poste.", "знае is a little irregular: јас знам.": "знае est un peu irrégulier : јас знам.", "We can come tomorrow.": "Nous pouvons venir demain.", "The children laugh at the joke.": "Les enfants rient de la blague.", "а-group or е-group?": "Groupe en -а ou groupe en -е ?", "а-group": "groupe -а", "е-group": "groupe -е", "Where do your parents live?": "Où habitent tes parents ?", "и-group verbs": "Verbes du groupe en -и", "I study Macedonian every day.": "J’étudie le macédonien tous les jours.", "и-group: јас + -ам → учам.": "Groupe en -и : јас + -ам → учам.", "What are you doing today?": "Que fais-tu aujourd’hui ?", "Bojan works in a hospital.": "Bojan travaille dans un hôpital.", "тој: no ending → работи.": "тој : pas de terminaison → работи.", "We walk to work.": "Nous allons au travail à pied.", "They are standing in front of the door.": "Ils sont debout devant la porte.", "стои gets a ј: јас стојам, тие стојат.": "стои prend un ј : јас стојам, тие стојат.", "Grandma Ruža thinks it will rain.": "Grand-mère Ruža pense qu’il va pleuvoir.", "таа: no ending → мисли.": "таа : pas de terminaison → мисли.", "You drive very fast!": "Vous conduisez très vite !", "Which group does each verb belong to?": "À quel groupe appartient chaque verbe ?", "а": "а", "е": "е", "и": "и", "Match each verb to its ‘јас’ (I) form.": "Associe chaque verbe à sa forme avec « јас » (je).", "Can, must, need": "Pouvoir, devoir, avoir besoin", "I can't come today, I'm ill. (a woman)": "Je ne peux pas venir aujourd’hui, je suis malade. (une femme)", "јас можам. After може comes да + verb.": "јас можам. Après може vient да + verbe.", "Tomorrow I have to get up early, I have an exam.": "Demain je dois me lever tôt, j’ai un examen.", "мора = must / have to: јас морам.": "мора = devoir : јас морам.", "We need to buy bread and milk.": "Nous devons acheter du pain et du lait.", "Треба да… = need to / should. треба never changes.": "Треба да… = il faut / on devrait. треба ne change jamais.", "I need an umbrella, it's raining!": "J’ai besoin d’un parapluie, il pleut !", "Ми треба = I need (literally ‘to me is needed’).": "Ми треба = j’ai besoin (mot à mot « il m’est nécessaire »).", "I want to go to the beach.": "Je veux aller à la plage.", "After сака, може, мора and треба the next verb comes with да.": "Après сака, може, мора et треба, le verbe suivant vient avec да.", "Can you help me?": "Tu peux m’aider ?", "Both verbs go with ти: можеш … да помогнеш.": "Les deux verbes vont avec ти : можеш … да помогнеш.", "They want to go to the cinema.": "Ils veulent aller au cinéma.", "тие сакаат да одат: both verbs in the тие form.": "тие сакаат да одат : les deux verbes à la forme тие.", "Can I have a glass of water?": "Est-ce que je peux avoir un verre d’eau ?", "We have to go home.": "Nous devons rentrer à la maison.", "Hobbies": "Les loisirs", "Match each hobby to its picture.": "Associe chaque loisir à son image.", "Ball sports: match the pictures.": "Sports de ballon : associe les images.", "Ivana likes to swim in the lake.": "Ivana aime nager dans le lac.", "таа сака да плива: the second verb also goes with таа.": "таа сака да плива : le deuxième verbe va aussi avec таа.", "What do you do in your free time?": "Que fais-tu pendant ton temps libre ?", "слободно време = free time.": "слободно време = temps libre.", "Which hobby happens on a mountain?": "Quel loisir se pratique en montagne ?", "планина = mountain, so планинарење = hiking.": "планина = montagne, donc планинарење = randonnée.", "With a ball or without one?": "Avec ou sans ballon ?", "with a ball": "avec ballon", "no ball": "sans ballon", "Marko plays football every Saturday.": "Marko joue au foot tous les samedis.", "тој игра. играње is the noun ‘playing’.": "тој игра. играње est le nom « le fait de jouer ».", "In my free time I like to read.": "Pendant mon temps libre, j’aime lire.", "Grape harvest (reading)": "Les vendanges (lecture)", "They pick the grapes in September.": "Ils cueillent le raisin en septembre.", "Во септември… They pick (собираат) the grapes.": "Во септември… Ils cueillent (собираат) le raisin.", "Grandpa Trajko works the most.": "Grand-père Trajko est celui qui travaille le plus.", "Grandma Cveta cooks lunch for everyone.": "Grand-mère Cveta prépare le déjeuner pour tout le monde.", "Why do they have to hurry? (брза = hurry)": "Pourquoi doivent-ils se dépêcher ? (брза = se dépêcher)", "…пред да почне дождот: before the rain starts.": "…пред да почне дождот : avant que la pluie commence.", "Who helps Grandpa Trajko?": "Qui aide grand-père Trajko ?", "What do they drink in the yard in the evening?": "Que boivent-ils dans la cour le soir ?", "домашен сок од грозје = homemade grape juice.": "домашен сок од грозје = jus de raisin fait maison.", "Words from the text: match them.": "Mots du texte : associe-les.", "grapes": "raisin", "yard": "cour", "rain": "pluie", "homemade": "fait maison", "helps": "aide", "picks": "cueille", "Grandma cooks lunch for everyone.": "Grand-mère prépare le déjeuner pour tout le monde.", "The weather": "La météo", "What's the weather like?": "Quel temps fait-il ?", "сонце = sun, so сончево = sunny.": "сонце = soleil, donc сончево = ensoleillé.", "дожд = rain; врне дожд = it's raining.": "дожд = pluie ; врне дожд = il pleut.", "снег = snow; вее снег = it's snowing.": "снег = neige ; вее снег = il neige.", "ветер = wind; дува = blows. You can also say: Ветровито е.": "ветер = vent ; дува = souffle. On peut aussi dire : Ветровито е.", "облак = cloud, so облачно = cloudy.": "облак = nuage, donc облачно = nuageux.", "35 degrees! It's very ___.": "35 degrés ! Il fait très ___.", "степени = degrees; топло = warm / hot.": "степени = degrés ; топло = chaud.", "It's very chilly today because it's cloudy.": "Il fait très frais aujourd’hui parce que le ciel est nuageux.", "затоа што (or бидејќи) = because.": "затоа што (ou бидејќи) = parce que.", "Match the weather words.": "Associe les mots de la météo.", "sun": "soleil", "cloud": "nuage", "snow": "neige", "wind": "vent", "cold": "froid", "Today the weather is sunny and warm.": "Aujourd’hui, il fait beau et chaud.", "The future with ќе": "Le futur avec ќе", "Tomorrow I will go to Mavrovo.": "Demain, j’irai à Mavrovo.", "ќе + the normal present form: ќе одам.": "ќе + la forme normale du présent : ќе одам.", "What will you do this weekend? (to a friend)": "Que feras-tu ce week-end ? (à un ami)", "ќе comes before the verb: ќе правиш.": "ќе se place avant le verbe : ќе правиш.", "We will go skiing in January.": "Nous irons skier en janvier.", "It will rain tomorrow.": "Il pleuvra demain.", "ќе врне = it will rain.": "ќе врне = il pleuvra.", "I won't come to the party, I'm working.": "Je ne viendrai pas à la fête, je travaille.", "‘Won't’ is нема да + verb, never „не ќе“.": "« Ne … pas » au futur, c’est нема да + verbe, jamais „не ќе“.", "They will stay three days at the hotel.": "Ils resteront trois jours à l’hôtel.", "ќе останат = they will stay.": "ќе останат = ils resteront.", "Now or later?": "Maintenant ou plus tard ?", "now": "maintenant", "later": "plus tard", "Tonight we will eat at a restaurant.": "Ce soir, nous mangerons au restaurant.", "Ivana won't work on Sunday.": "Ivana ne travaillera pas dimanche.", "A weekend in Mavrovo (reading)": "Un week-end à Mavrovo (lecture)", "Marko and Ivana will travel on Friday.": "Marko et Ivana partiront vendredi.", "It will be sunny on Saturday.": "Il fera beau samedi.", "Во сабота ќе вее снег. It will be sunny on Sunday.": "Во сабота ќе вее снег. Il fera beau dimanche.", "On Saturday they will ski all day.": "Samedi, ils skieront toute la journée.", "On Sunday they will stay at the hotel.": "Dimanche, ils resteront à l’hôtel.", "They will walk by the lake and go back to Skopje.": "Ils se promèneront au bord du lac et rentreront à Skopje.", "Where will they sit in the evening?": "Où s’assiéront-ils le soir ?", "покрај каминот = by the fireplace.": "покрај каминот = près de la cheminée.", "What will they drink in the evening?": "Que boiront-ils le soir ?", "топол чај = hot tea.": "топол чај = thé chaud.", "When will they go back to Skopje?": "Quand rentreront-ils à Skopje ?", "On Sunday it will be sunny.": "Dimanche, il fera beau.", "Him, her, them": "Le, la, les", "Where's the book? — I don't see it.": "Où est le livre ? — Je ne le vois pas.", "книга is feminine → ја.": "книга est féminin → ја.", "Where's the phone? — I have it in my bag.": "Où est le téléphone ? — Je l’ai dans mon sac.", "телефон is masculine → го.": "телефон est masculin → го.", "Do you like strawberries? — Yes, I love them.": "Tu aimes les fraises ? — Oui, je les adore.", "plural → ги.": "pluriel → ги.", "Ivana, Marko is looking for you!": "Ivana, Marko te cherche !", "Kids, Grandma Ruža is waiting for you!": "Les enfants, grand-mère Ruža vous attend !", "вас (you, plural) → ве.": "вас (vous, pluriel) → ве.", "Grandma is calling us to lunch.": "Grand-mère nous appelle pour le déjeuner.", "нас → нѐ. It's written with an accent so it isn't confused with не = not.": "нас → нѐ. Il s’écrit avec un accent pour ne pas le confondre avec не = ne … pas.", "Which is correct? (I'm reading the book.)": "Quelle phrase est correcte ? (Je lis le livre.)", "When the object has ‘the’ (книгата), Macedonian also puts ја before the verb.": "Quand le complément a « le / la » (книгата), le macédonien ajoute aussi ја devant le verbe.", "Which is correct? (I know him.)": "Quelle phrase est correcte ? (Je le connais.)", "The short form goes before the verb: го познавам.": "La forme courte se place devant le verbe : го познавам.", "Match each long form to its short form.": "Associe chaque forme longue à sa forme courte.", "I'm looking for the keys.": "Je cherche les clés.", "To me, to you, to him, to her": "À moi, à toi, à lui, à elle", "It's Ivana's birthday. I'm buying her flowers.": "C’est l’anniversaire d’Ivana. Je lui achète des fleurs.", "to her = ѝ, with an accent so it isn't confused with и = and.": "à elle = ѝ, avec un accent pour ne pas le confondre avec и = et.", "Grandpa Trajko can't see well. I read the newspaper to him.": "Grand-père Trajko ne voit pas bien. Je lui lis le journal.", "to him = му.": "à lui = му.", "The children are hungry. I'm giving them sandwiches.": "Les enfants ont faim. Je leur donne des sandwichs.", "to them = им. (ги = them, when nothing is given ‘to’ them.)": "à eux = им. (ги = les, quand on ne donne rien « à » quelqu’un.)", "I like Ohrid.": "J’aime Ohrid.", "Ми се допаѓа = I like (literally ‘it pleases me’).": "Ми се допаѓа = j’aime (mot à mot « ça me plaît »).", "Do you like Macedonian food? (to a friend)": "Tu aimes la cuisine macédonienne ? (à un ami)", "to you = ти.": "à toi = ти.", "We write to grandma every week.": "Nous écrivons à grand-mère toutes les semaines.", "на баба = to grandma, so ѝ.": "на баба = à grand-mère, donc ѝ. /* ---------- Round ---------- */
function startRound(which) {
  let qs, mk, en;
  const stops = LV().stops;
  if (which === "mix") { qs = shuffle(stops.flatMap(s => s.qs)).slice(0, 10); mk = "Мешана игра"; en = "Mixed round"; }
  else { const s = stops[which]; qs = shuffle(s.qs.slice()); mk = s.mk; en = s.en; }
  round = { which, level, qs, i: 0, score: 0, missed: [], mk, en };
  renderQuestion();
}

function renderQuestion() {
  const r = round, q = r.qs[r.i], n = r.qs.length;
  const card = h("article", { class: "qcard" });
  card.append(h("span", { class: "kind" }, kindLabel(q.t)));
  if (q.s) card.append(storyBox(q.s));
  const vis = visual(q); if (vis) card.append(vis);
  card.append(h("div", { class: "prompt" },
    h("p", { class: "q-mk" }, q.q || (q.t === "order" ? "Подреди ги зборовите." : "")),
    h("p", { class: "q-en" }, q.t === "order" && !q.q ? `“${T(q.en)}”` : T(q.en))));
  ({ mc: doMC, tf: doTF, match: doMatch, order: doOrder, sort: doSort })[q.t](card, q);
  $view.replaceChildren(
    h("div", { class: "playbar" },
      h("button", { class: "btn ghost", onclick: renderHome }, `← Станици · ${T("Stops")}`),
      h("div", { class: "title" }, r.mk, h("span", {}, T(r.en))),
      h("span", { class: "count" }, `${r.i + 1} / ${n}`)),
    h("div", { class: "track" }, h("div", { class: "fill", style: `width:${(r.i / n) * 100}%` })),
    card
  );
  window.scrollTo(0, 0);
}

function storyBox(key) {
  const s = STORIES[key];
  const en = h("p", { class: "story-en", hidden: true }, T(s.en));
  const btn = h("button", { class: "link", onclick: () => { en.hidden = !en.hidden; btn.textContent = en.hidden ? `Покажи превод · ${T("Show translation")}` : `Скриј превод · ${T("Hide translation")}`; } }, `Покажи превод · ${T("Show translation")}`);
  return h("div", { class: "story" }, s.pic ? h("div", { class: "story-pic", "aria-hidden": "true" }, s.pic) : null, h("p", { class: "story-mk" }, s.mk), en, btn);
}

function visual(q) {
  if (q.pic) return h("div", { class: "visual" }, h("div", { class: "pic", "aria-hidden": "true" }, q.pic));
  if (q.swatch) return h("div", { class: "visual" }, h("div", { class: "swatch", style: `background:${q.swatch}`, role: "img", "aria-label": "Colour" }));
  if (q.clock) return h("div", { class: "visual", html: clockSvg(q.clock) });
  if (q.flag) return h("div", { class: "visual", html: flagSvg() });
  if (q.scene) return h("div", { class: "visual", html: sceneSvg(q.scene) });
  if (q.street) return h("div", { class: "visual" }, h("div", { class: "street", role: "img", "aria-label": "Street" },
    ...q.street.map(x => { const [ic, lb] = x.split("|"); return h("div", { class: "bldg" }, h("span", { class: "bldg-ic", "aria-hidden": "true" }, ic), h("span", { class: "bldg-lb" }, lb)); })));
  return null;
}

function finish(card, q, ok, answer) {
  const r = round;
  if (ok) r.score++; else r.missed.push({ q, answer });
  const last = r.i === r.qs.length - 1;
  const next = h("button", { class: "btn primary", onclick: () => { if (last) renderEnd(); else { r.i++; renderQuestion(); } } },
    last ? `Резултат · ${T("Results")} →` : `Следно · ${T("Next")} →`);
  const fb = h("div", { class: "feedback " + (ok ? "good" : "bad"), role: "status" },
    h("p", { class: "fb-head" }, ok ? (g => `${g[0]} · ${T(g[1])}`)(GOOD[Math.floor(Math.random() * GOOD.length)]) : `Не баш. · ${T("Not quite.")}`),
    !ok && answer ? h("p", {}, `Точен одговор · ${T("Answer:")} `, h("b", {}, answer)) : null,
    q.why ? h("p", {}, T(q.why)) : null,
    next);
  card.append(fb);
  next.focus({ preventScroll: true });
  fb.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function doMC(card, q) {
  const correct = q.o[0];
  const opts = shuffle(q.o.slice());
  const grid = h("div", { class: "opts" + (opts.some(o => T(o).length > 24) ? " long" : "") });
  opts.forEach(o => grid.append(h("button", { class: "opt", "data-v": o, onclick: e => {
    [...grid.children].forEach(b => { b.disabled = true; if (b.dataset.v === correct) b.classList.add("is-right"); });
    if (o !== correct) e.currentTarget.classList.add("is-wrong");
    finish(card, q, o === correct, T(correct));
  } }, T(o))));
  card.append(grid);
}

function doTF(card, q) {
  const label = v => v ? `Точно · ${T("True")}` : `Неточно · ${T("False")}`;
  const grid = h("div", { class: "tf" });
  [true, false].forEach(v => grid.append(h("button", { class: "opt", onclick: e => {
    [...grid.children].forEach((b, i) => { b.disabled = true; if ([true, false][i] === q.a) b.classList.add("is-right"); });
    if (v !== q.a) e.currentTarget.classList.add("is-wrong");
    finish(card, q, v === q.a, label(q.a));
  } }, label(v))));
  card.append(grid);
}

function doMatch(card, q) {
  const L = shuffle(q.p.map((p, i) => ({ t: p[0], i }))), R = shuffle(q.p.map((p, i) => ({ t: p[1], i })));
  let sel = { L: null, R: null }, mistakes = 0, done = 0;
  const note = h("p", { class: "note" }, `Допри еден збор лево, па неговиот пар десно. · ${T("Tap a word on the left, then its partner on the right.")}`);
  const mk = (item, side) => {
    const b = h("button", { class: "mbtn" + (isPic(item.t) ? " pic" : ""), onclick: () => {
      if (b.classList.contains("ok")) return;
      const cur = sel[side]; if (cur) cur.el.classList.remove("sel");
      sel[side] = cur && cur.el === b ? null : { el: b, i: item.i };
      if (sel[side]) b.classList.add("sel");
      if (sel.L && sel.R) {
        const a = sel.L, c = sel.R; sel = { L: null, R: null };
        a.el.classList.remove("sel"); c.el.classList.remove("sel");
        if (a.i === c.i) {
          a.el.classList.add("ok"); c.el.classList.add("ok"); a.el.disabled = c.el.disabled = true; done++;
          if (done === q.p.length) finish(card, q, mistakes <= 1, mistakes <= 1 ? "" : q.p.map(p => `${p[0]} = ${T(p[1])}`).join(" · "));
        } else {
          mistakes++;
          [a.el, c.el].forEach(x => { x.classList.remove("no"); void x.offsetWidth; x.classList.add("no"); setTimeout(() => x.classList.remove("no"), 500); });
          note.textContent = `Грешки · ${T("Mistakes:")} ${mistakes}`;
        }
      }
    } }, T(item.t));
    return b;
  };
  card.append(h("div", { class: "match" }, h("div", { class: "mcol" }, L.map(x => mk(x, "L"))), h("div", { class: "mcol" }, R.map(x => mk(x, "R")))), note);
}

function doOrder(card, q) {
  const tiles = q.w.map((t, i) => ({ t, i }));
  let pool = shuffle(tiles.slice());
  for (let k = 0; k < 6 && pool.every((x, i) => x.i === i); k++) shuffle(pool);
  let line = [], checked = false;
  const lineEl = h("div", { class: "line" }), poolEl = h("div", { class: "pool" });
  const check = h("button", { class: "btn primary", disabled: true, onclick: () => {
    checked = true;
    const ans = line.map(x => x.t).join(" ");
    const ok = [q.w.join(" "), ...(q.alt || [])].includes(ans);
    lineEl.classList.add(ok ? "good" : "bad");
    [...lineEl.querySelectorAll("button"), check, clear].forEach(b => b.disabled = true);
    finish(card, q, ok, q.w.join(" "));
  } }, `Провери · ${T("Check")}`);
  const clear = h("button", { class: "btn", onclick: () => { pool = pool.concat(line); line = []; draw(); } }, `Почни одново · ${T("Start over")}`);
  function draw() {
    lineEl.replaceChildren(...(line.length ? line.map((x, k) => h("button", { class: "tile", onclick: () => { if (checked) return; line.splice(k, 1); pool.push(x); draw(); } }, x.t))
      : [h("span", { class: "ph" }, `Допри ги зборовите по ред · ${T("Tap the words in order")}`)]));
    poolEl.replaceChildren(...pool.map((x, k) => h("button", { class: "tile", onclick: () => { pool.splice(k, 1); line.push(x); draw(); } }, x.t)));
    check.disabled = pool.length > 0;
  }
  draw();
  card.append(lineEl, poolEl, h("div", { class: "row" }, check, clear));
}

function doSort(card, q) {
  const items = shuffle(q.i.slice());
  let k = 0, mistakes = 0, busy = false;
  const now = h("div", { class: "now" });
  const counter = h("p", { class: "note" });
  const drops = q.b.map(() => h("div", { class: "drops" }));
  const buckets = q.b.map((b, bi) => {
    const [mkL, enL] = split(b);
    return h("button", { class: "bucket", onclick: () => pick(bi) }, h("span", { class: "bh" }, mkL, h("span", {}, T(enL))), drops[bi]);
  });
  function show() {
    if (k < items.length) { now.replaceChildren(h("span", { class: "chip-big" }, items[k][0])); counter.textContent = `Збор ${k + 1} од ${items.length} · ${T("Word {a} of {b}.", { a: k + 1, b: items.length })} Допри кошничка · ${T("Tap a basket.")}`; }
    else now.replaceChildren();
  }
  function pick(bi) {
    if (busy || k >= items.length) return;
    busy = true;
    const [word, right] = items[k], ok = bi === right;
    if (!ok) mistakes++;
    const b = buckets[bi];
    b.classList.add(ok ? "flash-ok" : "flash-no");
    drops[right].append(h("span", { class: "drop" + (ok ? "" : " wrong") }, word));
    setTimeout(() => {
      b.classList.remove("flash-ok", "flash-no"); k++; busy = false; show();
      if (k === items.length) {
        buckets.forEach(x => x.disabled = true);
        counter.textContent = mistakes ? `Грешки · ${T("Mistakes:")} ${mistakes} (црвените зборови · ${T("the red words")})` : `Сите се точни! · ${T("All correct!")}`;
        finish(card, q, mistakes <= 1, mistakes <= 1 ? "" : q.b.map((bb, bi2) => `${split(bb)[0]}: ${q.i.filter(x => x[1] === bi2).map(x => x[0]).join(", ")}`).join(" · "));
      }
    }, 420);
  }
  show();
  card.append(now, counter, h("div", { class: "buckets" }, buckets));
}

/* ---------- End ---------- */
function renderEnd() {
  const r = round, n = r.qs.length, pct = r.score / n;
  const suns = pct >= 0.9 ? 3 : pct >= 0.7 ? 2 : pct >= 0.5 ? 1 : 0;
  let improved = false;
  const stops = LV(r.level).stops;
  if (r.which !== "mix") { const id = stops[r.which].id; if ((progress[id] || 0) < suns) { progress[id] = suns; save(); improved = true; } }
  const msg = [["Обиди се повторно!", "Have another go!"], ["Добар почеток!", "Good start!"], ["Многу добро!", "Very good!"], ["Браво!", "Brilliant!"]][suns];
  const actions = [h("button", { class: "btn primary", onclick: () => startRound(r.which) }, `Повторно · ${T("Play again")}`)];
  if (r.which !== "mix" && r.which < stops.length - 1) actions.push(h("button", { class: "btn", onclick: () => startRound(r.which + 1) }, `Следна станица · ${T("Next stop")} →`));
  actions.push(h("button", { class: "btn", onclick: renderHome }, `Сите станици · ${T("All stops")}`));
  $view.replaceChildren(
    h("div", { class: "playbar" }, h("button", { class: "btn ghost", onclick: renderHome }, `← Станици · ${T("Stops")}`), h("div", { class: "title" }, r.mk, h("span", {}, T(r.en)))),
    h("div", { class: "track" }, h("div", { class: "fill", style: "width:100%" })),
    h("article", { class: "qcard" },
      h("div", { class: "result" },
        sunsRow(suns, 46),
        h("div", { class: "big-score" }, `${r.score} / ${n}`),
        h("h2", {}, msg[0]),
        h("p", { class: "en", style: "margin:0" }, T(msg[1]) + (improved ? " " + T("New best for this stop.") : ""))),
      r.missed.length ? h("div", { class: "missed" },
        h("h3", {}, `За повторување · ${T("To review")}`),
        ...r.missed.map(m => h("div", { class: "miss" },
          h("p", {}, m.q.q || T(m.q.en)),
          m.q.q ? h("p", { class: "en" }, T(m.q.en)) : null,
          h("p", { class: "ans" }, m.answer || "")))) : null,
      h("div", { class: "end-actions" }, actions))
  );
  window.scrollTo(0, 0);
}

renderHome();
</script>

</body></html>
